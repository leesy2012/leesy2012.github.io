
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>4주 운동 프로그램</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --panel: #1c1e24;
  --accent: #b7ff3c;
  --muted: #a2a5af;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #f6f6f7;
  font-family: Arial, "Malgun Gothic", sans-serif;
}
header {
  padding: 30px 20px;
  text-align: center;
  background: linear-gradient(145deg,#272b31,#101114);
}
header h1 { margin: 0 0 8px; font-size: 28px; }
header p { margin: 0; color: var(--muted); }
main { max-width: 760px; margin: auto; padding: 20px; }
.hero {
  background: linear-gradient(120deg,#333a2b,#1b1e19);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
}
.hero .tag { color: var(--accent); font-weight: bold; }
.hero h2 { margin-bottom: 8px; }
.hero p { color: #d0d2d5; }
.weeks {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin: 20px 0;
}
.week {
  background: var(--panel);
  color: white;
  border: 1px solid #383b43;
  border-radius: 12px;
  padding: 14px 4px;
  cursor: pointer;
  font-size: 15px;
}
.week.active {
  background: var(--accent);
  color: #141414;
  border-color: var(--accent);
  font-weight: bold;
}
.summary {
  background: var(--panel);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
.progress-track {
  height: 9px;
  background: #393c44;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-bar {
  width: 0;
  height: 100%;
  background: var(--accent);
  transition: width .2s;
}
.exercise {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--panel);
  border: 1px solid #30323a;
  border-radius: 13px;
  margin-bottom: 10px;
}
.exercise input {
  width: 21px;
  height: 21px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.exercise .name { font-weight: bold; }
.exercise .detail {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}
.exercise.done .name {
  text-decoration: line-through;
  color: var(--muted);
}
footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
  font-size: 13px;
}
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
@media (max-width: 420px) {
  main { padding: 14px; }
  header h1 { font-size: 24px; }
  .week { font-size: 13px; padding: 12px 2px; }
}
</style>
</head>
<body>
<header>
  <h1>WORKOUT PLAN</h1>
  <p>4-WEEK TRAINING PROGRAM</p>
</header>

<main>
  <section class="hero">
    <div class="tag">YOUR TRAINING JOURNEY</div>
    <h2 id="weekTitle">1주차 · 기초 다지기</h2>
    <p id="weekDescription">정확한 자세와 꾸준한 운동 습관에 집중하세요.</p>
  </section>

  <nav class="weeks" aria-label="주차 선택">
    <button class="week active" data-week="1" aria-pressed="true">1주차</button>
    <button class="week" data-week="2" aria-pressed="false">2주차</button>
    <button class="week" data-week="3" aria-pressed="false">3주차</button>
    <button class="week" data-week="4" aria-pressed="false">4주차</button>
  </nav>

  <section class="summary">
    <div id="progressText">완료 0 / 4개 · 0%</div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </section>

  <section id="exerciseList" aria-live="polite"></section>
</main>

<footer>
  운동 완료 상태는 이 브라우저에 자동 저장됩니다.
</footer>

<script>
(function () {
  "use strict";

  const plans = {
    1: {
      title: "1주차 · 기초 다지기",
      description: "정확한 자세와 꾸준한 운동 습관에 집중하세요.",
      exercises: [
        ["숄더 프레스", "3세트 × 12회"],
        ["사이드 레터럴 레이즈", "3세트 × 15회"],
        ["프론트 레이즈", "3세트 × 12회"],
        ["덤벨 삼두 익스텐션", "3세트 × 12회"]
      ]
    },
    2: {
      title: "2주차 · 기초 강화",
      description: "자세를 유지하며 자신의 운동 능력에 맞춰 진행하세요.",
      exercises: [
        ["숄더 프레스", "3세트 × 12회"],
        ["사이드 레터럴 레이즈", "3세트 × 15회"],
        ["리어 델트 플라이", "3세트 × 12회"],
        ["케이블 푸시다운", "3세트 × 12회"]
      ]
    },
    3: {
      title: "3주차 · 운동 집중",
      description: "반동을 줄이고 각 동작을 통제하며 운동하세요.",
      exercises: [
        ["숄더 프레스", "4세트 × 10회"],
        ["사이드 레터럴 레이즈", "4세트 × 12회"],
        ["리어 델트 플라이", "3세트 × 15회"],
        ["덤벨 삼두 익스텐션", "3세트 × 12회"]
      ]
    },
    4: {
      title: "4주차 · 루틴 완성",
      description: "무리하지 않고 정확한 자세로 한 달의 루틴을 마무리하세요.",
      exercises: [
        ["숄더 프레스", "3세트 × 10회"],
        ["사이드 레터럴 레이즈", "3세트 × 15회"],
        ["리어 델트 플라이", "3세트 × 15회"],
        ["케이블 푸시다운", "3세트 × 12회"]
      ]
    }
  };

  const storageKey = "workout-plan-progress-v1";
  let state = { week: 1, completed: {} };

  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        if (Number.isInteger(parsed.week) &&
            parsed.week >= 1 && parsed.week <= 4) {
          state.week = parsed.week;
        }
        if (parsed.completed &&
            typeof parsed.completed === "object" &&
            !Array.isArray(parsed.completed)) {
          state.completed = parsed.completed;
        }
      }
    }
  } catch (error) {
    console.warn("저장된 진행 상태를 불러오지 못했습니다.", error);
  }

  function saveState() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (error) {
      console.warn("자동 저장에 실패했습니다.", error);
    }
  }

  function render() {
    const plan = plans[state.week];
    document.getElementById("weekTitle").textContent = plan.title;
    document.getElementById("weekDescription").textContent =
      plan.description;

    document.querySelectorAll(".week").forEach(function (button) {
      const active = Number(button.dataset.week) === state.week;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });

    const list = document.getElementById("exerciseList");
    list.replaceChildren();

    plan.exercises.forEach(function (exercise, index) {
      const key = state.week + "-" + index;
      const checked = state.completed[key] === true;

      const item = document.createElement("label");
      item.className = "exercise" + (checked ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = checked;
      checkbox.setAttribute("aria-label", exercise[0] + " 완료");

      const details = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = exercise[0];

      const detail = document.createElement("div");
      detail.className = "detail";
      detail.textContent = exercise[1];

      details.append(name, detail);
      item.append(checkbox, details);

      checkbox.addEventListener("change", function () {
        state.completed[key] = checkbox.checked;
        saveState();
        render();
      });

      list.appendChild(item);
    });

    const total = plan.exercises.length;
    const done = plan.exercises.filter(function (_, index) {
      return state.completed[state.week + "-" + index] === true;
    }).length;

    const percent = total ? Math.round(done / total * 100) : 0;
    document.getElementById("progressText").textContent =
      "완료 " + done + " / " + total + "개 · " + percent + "%";
    document.getElementById("progressBar").style.width = percent + "%";
  }

  document.querySelectorAll(".week").forEach(function (button) {
    button.addEventListener("click", function () {
      state.week = Number(button.dataset.week);
      saveState();
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
